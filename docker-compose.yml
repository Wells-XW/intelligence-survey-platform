version: "3.9"

services:
  # PostgreSQL 16 — Primary database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 — Cache and task queue (Phase 2)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Core Backend
  api:
    build:
      context: ./apps/api/core
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://survey:survey@postgres:5432/survey_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: dev-secret-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      PIPL_REGION: cn
      # AI / LLM (Phase 2)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_MAX_TOKENS: 4096
      LLM_TEMPERATURE: "0.3"
      LLM_REQUEST_TIMEOUT: "120"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/core:/app  # Hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker — async AI generation tasks
  celery-worker:
    build:
      context: ./apps/api/core
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://survey:survey@postgres:5432/survey_db
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_MAX_TOKENS: 4096
      LLM_TEMPERATURE: "0.3"
      LLM_REQUEST_TIMEOUT: "120"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./apps/api/core:/app
    restart: unless-stopped

  # React Frontend (development)
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/src  # Hot reload
      - ./apps/web/index.html:/app/index.html
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:
